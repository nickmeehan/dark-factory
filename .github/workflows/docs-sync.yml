name: Docs Sync

on:
  schedule:
    # Weekly, Monday 09:17 UTC. Off the hour to dodge the cron stampede.
    - cron: '17 9 * * 1'
  workflow_dispatch:

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Mirror docs.fabro.sh
        run: bin/sync-docs.sh

      - name: Guard against a partial fetch
        run: |
          # curl -f leaves a zero-byte file behind on an HTTP error. sync-docs.sh
          # is fail-closed enough to abort the run, but an empty page must never
          # reach main even if a future change loosens that.
          if find fabro-docs -type f -empty | grep -q .; then
            echo "::error::upstream fetch was partial - empty pages written"
            find fabro-docs -type f -empty
            exit 1
          fi

      - name: Detect drift
        id: drift
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- fabro-docs)" ]; then
            echo 'mirror already matches upstream'
            echo 'drift=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(git status --porcelain --untracked-files=all -- fabro-docs)
          {
            echo 'drift=true'
            echo "pages=$(find fabro-docs -name '*.md' | wc -l | tr -d ' ')"
            echo "added=$(printf '%s\n' "$status" | grep -c '^??' || true)"
            echo "updated=$(printf '%s\n' "$status" | grep -c '^ M' || true)"
          } >> "$GITHUB_OUTPUT"

      - name: Merge the sync
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # fix(), not docs(), on purpose: semantic-release's default rules give
          # docs: no release, and the mirror ships inside the plugin, so a
          # docs-only sync still needs to cut a version to reach users.
          SUBJECT: 'fix(docs): sync fabro docs mirror'
          PAGES: ${{ steps.drift.outputs.pages }}
          ADDED: ${{ steps.drift.outputs.added }}
          UPDATED: ${{ steps.drift.outputs.updated }}
        run: |
          BODY=$(printf '%s\n' \
            'Mirrors docs.fabro.sh into fabro-docs/ via bin/sync-docs.sh.' \
            '' \
            "- pages: $PAGES" \
            "- added: $ADDED" \
            "- updated: $UPDATED" \
            '' \
            "Opened by .github/workflows/docs-sync.yml (run $GITHUB_RUN_ID).")

          branch="docs-sync/$GITHUB_RUN_ID"
          git config user.name dark-factory-release-bot
          git config user.email dark-factory-release-bot@users.noreply.github.com
          git switch -c "$branch"
          git add -A fabro-docs
          git commit -m "$SUBJECT" -m "$BODY"
          git push -u origin "$branch"
          # Back to main so gh is never merging the branch it has checked out.
          git switch main

          gh pr create --base main --head "$branch" --title "$SUBJECT" --body "$BODY"

          # GitHub can still be computing mergeability right after the PR opens,
          # so retry - but re-check state first, since a retry after a merge that
          # actually landed would fail for the wrong reason.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$branch" --squash --subject "$SUBJECT" --body "$BODY"; then
              break
            fi
            if [ "$(gh pr view "$branch" --json state --jq .state)" = 'MERGED' ]; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo '::error::could not merge the docs sync PR'
              exit 1
            fi
            echo "merge attempt $attempt failed, retrying"
            sleep 5
          done

          # Best-effort: the branch may already be gone if a retry landed the merge.
          git push origin --delete "$branch" || true

      - name: Release the synced docs
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A push made with GITHUB_TOKEN does not start another workflow run, so
        # Release has to be dispatched explicitly. workflow_dispatch is the one
        # event GITHUB_TOKEN may still trigger.
        run: gh workflow run release.yml --ref main
