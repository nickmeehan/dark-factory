name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: dark-factory-release-bot
          GIT_AUTHOR_EMAIL: dark-factory-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: dark-factory-release-bot
          GIT_COMMITTER_EMAIL: dark-factory-release-bot@users.noreply.github.com
        run: pnpm exec semantic-release
